apiVersion: v1
kind: Service
metadata:
  name: translation-api
  namespace: whispertrans
  labels:
    app: translation-api
spec:
  selector:
    app: translation-api
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 8000
    nodePort: 30800  # accessible at localhost:8000 via kind port mapping
