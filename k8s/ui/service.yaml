apiVersion: v1
kind: Service
metadata:
  name: translation-ui
  namespace: whispertrans
  labels:
    app: translation-ui
spec:
  selector:
    app: translation-ui
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 7860
    nodePort: 30860  # exposed on the kind node → localhost:7860 via kind mapping
