# kind cluster config for local whisperTrans testing
# Port mappings: host:containerPort → node:nodePort
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: whispertrans
nodes:
- role: control-plane
  extraPortMappings:
  # API Gateway → localhost:8000
  - containerPort: 30800
    hostPort: 8000
    protocol: TCP
  # Gradio UI → localhost:7860
  - containerPort: 30860
    hostPort: 7860
    protocol: TCP
